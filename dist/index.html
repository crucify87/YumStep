gin-top:25px}.detailphoto{width:100%;height:350px;object-fit:cover;border-radius:20px}.stats{display:flex;gap:12px;margin:25px 0}.stats>div{background:#f3f5f0;border-radius:12px;flex:1;padding:15px;text-align:center}.stats small{display:block;color:var(--muted);margin-bottom:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.ing{border-bottom:1px solid var(--line);padding:15px 0}.ing input{accent-color:var(--green);margin-right:10px}.step{background:#f5f6f2;border-radius:14px;padding:18px;margin:15px 0}.step b{display:block;margin-bottom:8px}.step p{margin:0}.back{color:var(--green);font-weight:700;margin-bottom:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.diff{padding:15px;background:#eaf6ef;margin:10px 0;border-radius:12px}.diff del{color:#91a096;margin-right:15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{display:block;font-weight:700;font-size:12px}label input,label select,label textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:7px;background:#fafbf8;color:var(--ink)}label.full{grid-column:1/-1}textarea{min-height:95px;resize:vertical}.tree{border-left:2px solid #9ccdb7;padding-left:28px;margin-left:15px}.node{display:block;background:var(--mint);border:1px solid #b8daca;padding:20px;border-radius:14px;margin:20px 0;text-align:left;width:100%}.modal{position:fixed;inset:0;background:#172c2377;z-index:50;display:grid;place-items:center;padding:20px}.dialog{background:white;padding:30px;border-radius:22px;max-width:650px;max-height:90vh;overflow:auto;width:100%}.timer{font-size:65px;letter-spacing:-3px;text-align:center;font-weight:900;padding:35px;border:10px solid #bde8d5;border-radius:50%;width:250px;height:250px;margin:25px auto;display:grid;place-content:center}.timer small{font-size:12px;letter-spacing:0;font-weight:500}.cook{max-width:760px;margin:auto}.progress{height:7px;background:#e1e7df;border-radius:10px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:#10b985}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#203d30;color:white;padding:13px 25px;border-radius:30px;z-index:100;display:none}.empty{padding:70px;text-align:center}.subtle{font-size:12px;color:var(--muted)}.mobile{display:none}footer{border-top:1px solid var(--line);padding:24px 0;margin-top:40px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px} @media(max-width:900px){header{padding:0 20px;height:72px}nav{gap:18px}.brand small{display:none}.shell{padding:25px 20px 100px}.intro{display:block}h1{font-size:34px}.search{min-width:0;margin-top:20px}.grid{grid-template-columns:1fr 1fr}.hero-text{padding:25px}.hero h2{font-size:27px}.detail{grid-template-columns:1fr}}@media(max-width:600px){nav{display:none}.brand{font-size:22px}header .primary{padding:10px 15px;font-size:12px}.hero{grid-template-columns:1fr;margin-top:20px}.hero-img{height:220px}.hero-text{padding:25px}.hero h2{font-size:29px}.grid{grid-template-columns:1fr}.cover{height:245px}.intro p{font-size:13px}.two,.fields{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:25;justify-content:space-around;border-top:1px solid var(--line);padding:12px 4px}.mobile button{font-size:11px;font-weight:700}.mobile span{display:block;font-size:21px;margin-bottom:4px}.panel{padding:20px}.shell{padding-top:24px}.section-head h2{font-size:22px}footer{display:block}.chips{gap:6px}.chip{padding:9px 14px}h1{font-size:32px}}

obile" id="mobile"></div><div id="overlay"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[{id:'pasta',title:'바질 토마토 파스타',desc:'신선한 바질과 방울토마토로 완성하는, 가장 기분 좋은 한 접시.',author:'그린셰프 민지',time:20,cat:'양식',tags:['채식','간편식'],photo:'pasta.jpg',allergen:'밀',ingredients:[['스파게티 파스타면',180,'g'],['방울토마토',15,'개'],['생바질 잎',10,'장'],['엑스트라 버진 올리브오일',3,'큰술'],['다진 마늘',1,'큰술'],['소금',1,'작은술']],steps:['끓는 물에 소금을 넣고 파스타를 8분 삶아주세요. 면수 100ml를 남겨둡니다.','팬에 올리브오일을 두르고 마늘을 볶은 후, 반으로 자른 방울토마토를 넣고 볶아주세요.','삶은 면과 면수를 넣고 잘 섞으며 소스를 입혀주세요.','불을 끄고 생바질을 올려 마무리합니다.'],timers:[480,300,120,0],servings:2},{id:'toast',title:'아보카도 에그 토스트',desc:'크리미한 아보카도와 달걀, 스리라차 한 방울로 달라지는 아침.',author:'모닝키친',time:10,cat:'양식',tags:['15분 컷','매운맛'],photo:'toast.jpg',allergen:'밀, 달걀',ingredients:[['식빵',2,'장'],['아보카도',1,'개'],['달걀',2,'개'],['스리라차',1,'작은술']],steps:['빵을 바삭하게 구워주세요.','아보카도를 으깨 빵 위에 올려주세요.','달걀을 익혀 올리고 소스로 마무리합니다.'],timers:[120,0,180],servings:2},{id:'curry',title:'채소 듬뿍 치킨 카레',desc:'브로콜리와 감자를 가득 넣은, 따뜻하고 든든한 오늘의 식탁.',author:'한스푼 연구소',time:25,cat:'아시아',tags:['고단백','간편식'],photo:'curry.jpg',allergen:'카레 제품의 표시 확인',ingredients:[['닭가슴살',200,'g'],['브로콜리',100,'g'],['감자',1,'개'],['카레가루',40,'g']],steps:['닭가슴살과 채소를 한입 크기로 썰어주세요.','팬에서 닭고기를 충분히 익힌 후 채소를 넣습니다.','물과 카레가루를 넣고 감자가 익을 때까지 끓입니다.'],timers:[0,420,600],servings:2}];
let state=JSON.parse(localStorage.getItem('yumstep-v1')||'{"recipes":[],"saved":[],"reviews":{},"likes":[],"profile":"나의 키친"}');let page='explore',filter='전체',query='',current='pasta',portion=2,step=0,seconds=0,ticking=false,clock,deadline=0,shopping=[];
const recipes=()=>[...seed,...state.recipes],get=id=>recipes().find(x=>x.id===id),persist=()=>{if(window.yumstepCloud)window.yumstepCloud.persist(state);else localStorage.setItem('yumstep-v1',JSON.stringify(state))};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}
const tabs=[['explore','레시피 찾기','◈'],['tree','레시피 관계도','⑂'],['fridge','냉장고 요리','▤'],['saved','저장한 레시피','▱'],['profile','내 키친','◉']];
function go(p){clearInterval(clock);ticking=false;page=p;render();window.scrollTo(0,0)}
function render(){for(const target of ['nav','mobile'])$('#'+target).innerHTML=tabs.map(([p,t,i])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${target==='mobile'?`<span>${i}</span>`:''}${t}</button>`).join('');if(page==='detail')return detail();if(page==='compare')return compare();if(page==='cook')return cook();if(page==='tree')return tree();if(page==='profile')return profile();explore()}
function cards(list){return list.length?list.map(r=>`<article class="card"><div class="cover" onclick="openRecipe('${r.id}')"><img src="${esc(r.photo)}" alt="${esc(r.title)}"><span class="badge">◷ ${r.time}분 · ${esc(r.difficulty||'쉬움')}</span><button class="save" aria-label="레시피 저장" onclick="event.stopPropagation();save('${r.id}')">${state.saved.includes(r.id)?'▣':'▱'}</button></div><div class="card-body"><span class="tag">${r.parent?'변형 레시피':'기본 레시피'}</span><h3 style="margin-top:12px"><button onclick="openRecipe('${r.id}')" style="text-align:left;padding:0">${esc(r.title)}</button></h3><p>${esc(r.desc)}</p>${r.tags.map(t=>`<span class="tag">${esc(t)}</span> `).join('')}<div class="meta"><span><span class="avatar">${esc(r.author[0])}</span>${esc(r.author)}</span><button onclick="openRecipe('${r.id}')">레시피 보기 ↗</button></div></div></article>`).join(''):'<div class="empty">조건에 맞는 레시피가 없습니다.</div>'}
function explore(){let saved=page==='saved',fridge=page==='fridge';$('#app').innerHTML=`<div class="intro"><div><div class="eyebrow">찾고, 만들고, 기록하는 나만의 레시피</div><h1>${saved?'저장한 레시피를 다시 찾아보세요':fridge?'냉장고 재료로 요리를 찾아보세요':'오늘 만들 요리를 찾아보세요'}</h1><p>${saved?'저장한 레시피를 한곳에서 확인할 수 있어요.':fridge?'재료를 쉼표로 구분해 입력하세요. 입력한 재료 중 하나 이상이 들어간 레시피를 찾아드려요.':'레시피를 찾아보고, 재료나 조리법을 바꿔 나만의 레시피로 저장하세요.'}</p></div><div class="search"><span>⌕</span><input aria-label="레시피 검색" placeholder="${fridge?'예: 달걀, 토마토, 마늘':'요리 이름, 재료, 태그로 검색하세요'}" value="${esc(query)}" oninput="query=this.value;updateResults()"><button onclick="filters()" aria-label="필터">☷</button></div></div>${!saved&&!fridge?`<div class="hero"><div class="hero-text"><span class="tag">오늘의 추천 레시피</span><h2>바질 토마토 파스타를<br>만들어 보세요</h2><p>기본 레시피를 따라 만들거나<br>재료를 바꿔 나만의 레시피로 저장하세요.</p><button class="primary" onclick="openRecipe('pasta')">추천 레시피 보기 ↗</button></div><div class="hero-img"><img src="pasta.jpg" alt="바질과 토마토 파스타"><span class="photo-label">그린셰프 민지의 레시피 · 조리 시간 20분</span></div></div>`:''}<div class="section-head"><div><h2>${saved?'저장한 레시피':fridge?'재료로 찾은 레시피':'레시피 둘러보기'}</h2><p class="subtle">${saved?'레시피의 저장 버튼을 누르면 이곳에 모아 볼 수 있어요.':'레시피를 선택하면 재료와 조리 순서를 확인할 수 있어요.'}</p></div><button class="outline" onclick="filter='전체';query='';render()">검색어·분류 초기화</button></div><div class="chips">${['전체','채식','15분 컷','고단백','양식','아시아'].map(t=>`<button class="chip ${filter===t?'on':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><div class="grid" id="results"></div><footer><b>YumStep <span style="font-weight:400">나만의 레시피 노트</span></b><span>매일의 요리를 기록하세요.</span><button onclick="policy()">이용 안내</button></footer><p class="notice">체험 버전 · 예시 레시피 포함 · 로그인 전에는 브라우저에 저장됩니다. 로그인 후 저장 상태는 상단에서 확인하세요.</p>`;updateResults()}
let maxTime=999,exclude='';function updateResults(){let list=recipes().filter(r=>(page!=='saved'||state.saved.includes(r.id))&&(filter==='전체'||r.tags.includes(filter)||r.cat===filter)&&(r.time<=maxTime)&&(!exclude||!r.allergen.includes(exclude)));list=list.filter(r=>page==='fridge'?query.split(',').filter(t=>t.trim()).some(t=>r.ingredients.some(i=>i[0].includes(t.trim())))||!query:(r.title+r.desc+r.tags.join()+r.ingredients.flat().join()).toLowerCase().includes(query.toLowerCase()));$('#results').innerHTML=cards(list)}
function save(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();render();toast(state.saved.includes(id)?'레시피를 저장했어요.':'저장을 해제했어요.')}
function openRecipe(id){current=id;portion=get(id).servings;go('detail')}
function detail(){let r=get(current),parent=get(r.parent);$('#app').innerHTML=`<button class="back" onclick="go('explore')">← 레시피 목록으로</button><div class="detail"><div><img class="detailphoto" src="${esc(r.photo)}" alt="${esc(r.title)}"><div class="panel" style="margin-top:20px"><div class="row"><h3>재료 준비</h3><div><button class="outline" onclick="portion=Math.max(1,portion-1);detail()">−</button> <b>${portion}인분</b> <button class="outline" onclick="portion++;detail()">＋</button></div></div>${r.ingredients.map(([n,a,u])=>`<div class="row ing"><label><input type="checkbox" style="display:inline;width:auto">${esc(n)}</label><b>${+(a*portion/r.servings).toFixed(2)}${esc(u)}</b></div>`).join('')}<button class="outline" style="margin-top:20px" onclick="shop()">＋ 장보기 목록 만들기</button><p class="subtle">이 앱의 계량 기준: 1큰술 = 15ml · 1작은술 = 5ml · 1컵 = 200ml. 부피를 무게(g)로 자동 변환하지 않습니다.</p></div></div><div><span class="tag">${parent?'변형 레시피':'기본 레시피'}</span><h1 style="font-size:35px">${esc(r.title)}</h1><p>${esc(r.desc)}</p>${parent?`<button class="tag" onclick="openRecipe('${parent.id}')">⑂ ${esc(parent.author)}님의 ‘${esc(parent.title)}’에서 변형 ↗</button>`:''}<div class="stats"><div><small>조리 시간</small><b>${r.time}분</b></div><div><small>난이도</small><b>${esc(r.difficulty||'쉬움')}</b></div><div><small>카테고리</small><b>${esc(r.cat)}</b></div></div><div class="row panel"><span><span class="avatar">${esc(r.author[0])}</span>${esc(r.author)}</span><button class="outline" onclick="toast('현재 체험 버전에서는 팔로우 기능을 사용할 수 없어요.')">팔로우 (준비 중)</button></div><div class="panel" style="background:#fff3e8;border-color:#f2dcc9"><h3>이 레시피를 내 취향에 맞게 바꿔보세요</h3><p>원본을 복사한 뒤 재료와 조리 순서를 수정하세요.<br>원본 레시피와 작성자 정보가 함께 표시됩니다.</p><button class="orange" onclick="editor('${r.id}')">⑂ 레시피 바꿔 만들기</button> <button onclick="${parent?"go('compare')":"go('tree')"}">${parent?'원본과 비교 ↗':'레시피 관계도 ↗'}</button></div><div class="row"><button class="outline" onclick="like()">${state.likes.includes(r.id)?'♥':'♡'} 좋아요</button><button class="outline" onclick="save('${r.id}')">${state.saved.includes(r.id)?'▣ 저장됨':'▱ 저장'}</button><button class="primary" onclick="step=0;beginCook()">조리 모드 시작 →</button></div></div></div><div class="two"><div class="panel"><h3>차근차근, 조리 순서</h3>${r.steps.map((s,i)=>`<div class="step"><b><span class="avatar">${i+1}</span> ${i+1}단계 ${r.timers[i]?'· '+Math.round(r.timers[i]/60)+'분':''}</b><p>${esc(s)}</p></div>`).join('')}</div><div><div class="panel"><h3>요리 팁</h3><p>${esc(r.tips||'재료의 크기와 조리 도구에 따라 익는 시간이 달라질 수 있어요. 재료가 충분히 익었는지 확인하며 조리 시간을 조절하세요.')}</p><h3>보관 · 알레르기</h3><p>${esc(r.storage||'조리 후 가능한 바로 드세요. 남은 음식은 식혀 밀폐 후 냉장 보관하세요.')}</p><span class="tag">알레르기 유발 재료: ${esc(r.allergen)}</span><p class="subtle">입력 정보만으로 알레르기 안전을 보장하지 않습니다. 제품 표시를 직접 확인하세요.</p></div><div class="panel"><div class="row"><h3>요리 후기</h3><button class="outline" onclick="reviewForm()">＋ 후기 작성</button></div>${(state.reviews[current]||[]).map(v=>`<div class="step"><b>${'★'.repeat(v.rating)}</b><p>${esc(v.text)}</p>${v.photo?`<img src="${v.photo}" style="width:100%;border-radius:10px" alt="직접 만든 요리">`:''}</div>`).join('')||'<p>아직 후기가 없어요. 직접 만들어 본 후기를 남겨주세요.</p>'}</div></div></div>`}
function like(){state.likes=state.likes.includes(current)?state.likes.filter(x=>x!==current):[...state.likes,current];persist();detail()}
function modal(html){$('#overlay').innerHTML=`<div class="modal"><div class="dialog"><div style="text-align:right"><button class="outline" onclick="closeModal()">닫기 ×</button></div>${html}</div></div>`}function closeModal(){$('#overlay').innerHTML=''}
function filters(){modal(`<h2>검색 조건 설정</h2><label>최대 조리 시간<select id="ft"><option value="999">전체</option><option value="15">15분 이하</option><option value="30">30분 이하</option></select></label><br><label>제외할 알레르기 유발 재료<input id="fa" placeholder="예: 밀"></label><p class="subtle">레시피에 입력된 알레르기 정보를 검색합니다. 조리 중 다른 재료와의 접촉 여부는 확인할 수 없습니다.</p><button class="primary" onclick="maxTime=+$('#ft').value;exclude=$('#fa').value;closeModal();render()">필터 적용</button>`)}
function shop(){let r=get(current);shopping=r.ingredients.map(([n,a,u])=>`${n} ${+(a*portion/r.servings).toFixed(2)}${u}`);modal(`<h2>장보기 목록</h2>${shopping.map(t=>`<div class="ing"><label><input type="checkbox" style="display:inline;width:auto">${esc(t)}</label></div>`).join('')}<br><button class="primary" onclick="navigator.clipboard?.writeText(shopping.join('\\n')).then(()=>toast('목록을 복사했어요.')).catch(()=>toast('복사를 지원하지 않는 환경입니다.'))">목록 복사</button>`)}
let uploadedPhoto='';function editor(id){let r=id?get(id):null;uploadedPhoto=r?.photo||'pasta.jpg';modal(`<h2>${r?'레시피 바꿔 만들기':'새 레시피 작성'}</h2><p>${r?'원본 레시피를 복사했어요. 바꿀 재료와 조리 순서를 수정해 주세요.':'요리 이름, 재료, 조리 순서를 입력해 주세요.'}</p><form onsubmit="submitRecipe(event,'${id||''}')"><div class="fields"><label class="full">요리 이름<input name="title" required value="${esc(r?r.title+' · 나의 버전':'')}"></label><label class="full">한 줄 소개<input name="desc" required value="${esc(r?.desc||'')}"></label><label>카테고리<select name="cat">${['한식','양식','아시아','디저트','기타'].map(t=>`<option ${r?.cat===t?'selected':''}>${t}</option>`).join('')}</select></label><label>조리 시간(분)<input name="time" type="number" min="1" max="1440" required value="${r?.time||20}"></label><label>인분<input name="servings" type="number" min="1" max="100" required value="${r?.servings||2}"></label><label>난이도<select name="difficulty"><option>쉬움</option><option>보통</option><option>어려움</option></select></label><label class="full">요리 대표 사진 (선택, 10MB 이하 · 저장 시 축소)<input type="file" accept="image/*" onchange="readPhoto(this)"></label><label class="full">재료 (한 줄에 하나씩, 예: 감자 | 2 | 개)<textarea name="ingredients" required>${esc(r?.ingredients.map(i=>i.join(' | ')).join('\n')||'')}</textarea></label><label class="full">조리 순서 (한 줄에 한 단계씩 입력)<textarea name="steps" required>${esc(r?.steps.join('\n')||'')}</textarea></label><label class="full">단계별 타이머 (초, 예: 60, 0, 180 / 0은 타이머 없음)<input name="timers" value="${r?.timers.join(',')||'0'}"></label><label>태그 (쉼표로 구분)<input name="tags" placeholder="저염, 비건, 재료 대체" value="${esc(r?.tags.join(', ')||'')}"></label><label>알레르기 유발 재료<input name="allergen" required value="${esc(r?.allergen||'없음')}"></label><label class="full">${r?'변경 이유':'요리 팁'}<textarea name="reason" ${r?'required':''}></textarea></label><label class="full">보관법<input name="storage" value="${esc(r?.storage||'조리 후 바로 드시는 것을 권장합니다.')}"></label><label class="full">공개 설정<select disabled><option>나만 보기</option></select></label></div><p class="subtle">직접 작성하거나 사용 권한이 있는 사진과 설명을 등록해 주세요. 다른 이용자에게 공개되지 않습니다. 로그인하면 본인 계정에 저장하며, 클라우드 저장 상태는 상단에서 확인하세요.</p><button class="orange" type="submit">${r?'저장 후 원본과 비교':'레시피 저장'}</button></form>`)}
async function imageForCloud(file){
 if(!file||!file.type.startsWith('image/')||file.size>10000000)throw Error('image');
 const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
 if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth*img.naturalHeight>40000000)throw Error('dimensions');
 const scale=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 for(const quality of [.8,.65,.45,.25]){const data=canvas.toDataURL('image/jpeg',quality);if(data.length<450000)return data;}throw Error('size');
 }finally{URL.revokeObjectURL(url)}
}
async function readPhoto(input){const file=input.files[0];if(!file)return;const form=input.form;const submit=form.querySelector('[type="submit"]');submit.disabled=true;try{const photo=await imageForCloud(file);if(form.isConnected)uploadedPhoto=photo;}catch{toast('사진을 읽지 못했습니다. 10MB 이하의 이미지로 다시 선택해 주세요.')}finally{submit.disabled=false}}
async function readReviewPhoto(input){const file=input.files[0];if(!file)return;const form=input.form,submit=form.querySelector('button');submit.disabled=true;try{const photo=await imageForCloud(file);if(form.isConnected)reviewPhoto=photo;}catch{toast('사진을 읽지 못했습니다. 다른 이미지를 선택해 주세요.')}finally{submit.disabled=false}}

function submitRecipe(e,parent){e.preventDefault();let f=new FormData(e.target),ing=f.get('ingredients').split('\n').filter(x=>x.trim()).map(x=>{let [n,a,u]=x.split('|').map(t=>t.trim());return[n,Number(a),u||'개']});if(!ing.length||ing.some(i=>!i[0]||!Number.isFinite(i[1])||i[1]<=0))return toast('재료를 ‘재료명 | 양 | 단위’로 입력해 주세요.');let steps=f.get('steps').split('\n').filter(x=>x.trim()),timers=f.get('timers').split(',').map(Number);if(timers.some(t=>!Number.isFinite(t)||t<0))return toast('타이머는 초 단위로 0 이상인 숫자를 입력해 주세요.');let r={id:'r'+Date.now(),title:f.get('title'),desc:f.get('desc'),cat:f.get('cat'),time:+f.get('time'),servings:+f.get('servings'),difficulty:f.get('difficulty'),ingredients:ing,steps,timers:steps.map((_,i)=>timers[i]||0),tags:f.get('tags').split(',').map(t=>t.trim()).filter(Boolean),allergen:f.get('allergen'),reason:f.get('reason'),tips:parent?'':f.get('reason'),storage:f.get('storage'),photo:uploadedPhoto,author:state.profile,parent:parent||null};state.recipes.push(r);try{persist()}catch{state.recipes.pop();return toast('저장 공간이 부족합니다. 작은 사진을 사용해 주세요.')}current=r.id;portion=r.servings;closeModal();go(parent?'compare':'detail');toast('레시피를 저장했어요. 클라우드 저장 상태는 상단을 확인하세요.')}
function compare(){let r=get(current),o=get(r.parent);if(!o)return go('tree');let names=[...new Set([...o.ingredients,...r.ingredients].map(i=>i[0]))];$('#app').innerHTML=`<button class="back" onclick="go('detail')">← 레시피로</button><span class="tag">원본과 변경 내용 비교</span><h1>원본과 무엇이 달라졌나요?</h1><p>${esc(o.author)}님의 레시피를 바탕으로 ${esc(r.author)}님이 재료나 조리법을 바꿨어요.</p><div class="panel"><h3>레시피를 바꾼 이유</h3><p>${esc(r.reason)}</p></div><div class="two">${[o,r].map((v,i)=>`<div class="panel"><span class="tag">${i?'변형 레시피':'원본 레시피'}</span><img class="detailphoto" style="height:230px;margin-top:15px" src="${esc(v.photo)}"><h2>${esc(v.title)}</h2><p>${v.time}분 · ${v.servings}인분</p></div>`).join('')}</div><div class="panel"><h3>재료 변경 비교</h3><p class="subtle">각 레시피의 기본 인분 기준으로 비교합니다.</p>${names.map(n=>{let a=o.ingredients.find(i=>i[0]===n),b=r.ingredients.find(i=>i[0]===n);if(JSON.stringify(a)===JSON.stringify(b))return '';return`<div class="diff"><b>${esc(n)}</b><p><del>${a?esc(a[1]+a[2]):'없음'}</del> → <b>${b?esc(b[1]+b[2]):'삭제됨'}</b></p></div>`}).join('')||'<p>재료 변경이 없습니다.</p>'}</div><div class="panel"><h3>조리 단계 비교</h3>${Array.from({length:Math.max(o.steps.length,r.steps.length)},(_,i)=>`<div class="two step"><div><b>원본 ${i+1}단계</b><p>${esc(o.steps[i]||'없음')}</p></div><div style="${o.steps[i]!==r.steps[i]?'background:#e0f1e5;padding:10px;border-radius:10px':''}"><b>변형 ${i+1}단계</b><p>${esc(r.steps[i]||'삭제됨')}</p></div></div>`).join('')}</div><button class="primary" onclick="go('detail')">이 레시피 보기 →</button>`}
function tree(){let filterTag='';$('#app').innerHTML=`<div class="eyebrow">원본과 변형 레시피</div><h1>레시피가 어떻게 바뀌었는지 확인하세요</h1><p>기본 레시피와 이를 바탕으로 만든 변형 레시피를 함께 볼 수 있어요.</p>${seed.map(r=>`<div class="panel"><button class="node" onclick="openRecipe('${r.id}')"><span class="tag">기본 레시피 · ${esc(r.author)}</span><h2 style="margin-top:12px">${esc(r.title)}</h2></button><div class="tree">${state.recipes.filter(v=>v.parent===r.id).map(v=>branch(v,0)).join('')||'<p>아직 이 레시피를 바탕으로 만든 변형 레시피가 없어요.</p>'}<button class="orange" onclick="editor('${r.id}')">＋ 이 레시피 바꿔 만들기</button></div></div>`).join('')}`}
function branch(v,depth){return `<button class="node" onclick="openRecipe('${v.id}')">⑂ ${esc(v.title)}<p>${esc(v.tags.join(' · '))}</p></button>${depth<10?`<div class="tree">${state.recipes.filter(x=>x.parent===v.id).map(x=>branch(x,depth+1)).join('')}</div>`:''}`}
function beginCook(){seconds=get(current).timers[step]||0;go('cook');if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(x=>{window.wl=x;$('#wake').textContent='● 화면 켜짐 유지 중'}).catch(()=>{})}
function cook(){let r=get(current);$('#app').innerHTML=`<div class="cook"><div class="row"><button class="back" onclick="window.wl?.release();go('detail')">× 조리 종료</button><span class="tag" id="wake">조리 모드</span></div><h2>${esc(r.title)}</h2><div class="row" style="margin-top:20px"><b>전체 ${r.steps.length}단계 중 ${step+1}단계</b><b>${Math.round((step+1)/r.steps.length*100)}%</b></div><div class="progress"><div style="width:${(step+1)/r.steps.length*100}%"></div></div><div class="panel"><span class="tag">진행 중인 단계</span><h1 style="font-size:30px">${step+1}단계</h1><p style="font-size:22px;line-height:1.9;color:var(--ink)">${esc(r.steps[step])}</p></div><div class="panel"><div class="row"><h3>조리 타이머</h3><span class="tag">단계별 시간</span></div><div class="timer"><small>남은 시간</small><span id="time">${fmt(seconds)}</span></div><div class="row" style="justify-content:center"><button class="outline" onclick="clearInterval(clock);ticking=false;seconds=get(current).timers[step]||0;$('#time').textContent=fmt(seconds);$('#play').textContent='▶ 시작'">↺ 타이머 초기화</button><button class="primary" id="play" onclick="toggleTimer()">▶ 시작</button><button class="outline" onclick="seconds+=60;if(ticking)deadline+=60000;$('#time').textContent=fmt(seconds)">＋ 1분</button></div></div><div class="row"><button class="outline" ${step===0?'disabled':''} onclick="step--;beginCook()">← 이전 단계</button><button class="primary" onclick="${step===r.steps.length-1?"window.wl?.release();go('detail');reviewForm()":"step++;beginCook()"}">${step===r.steps.length-1?'요리 완료 ✓':'다음 단계 →'}</button></div></div>`}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function toggleTimer(){if(ticking){clearInterval(clock);ticking=false;$('#play').textContent='▶ 이어서 시작';return}if(seconds<=0)return toast('타이머 시간을 추가해 주세요.');ticking=true;$('#play').textContent='Ⅱ 일시 정지';deadline=Date.now()+seconds*1000;clock=setInterval(()=>{seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#time').textContent=fmt(seconds);if(seconds===0){clearInterval(clock);ticking=false;$('#play').textContent='▶ 시작';toast('설정한 조리 시간이 끝났어요.');navigator.vibrate?.(500)}},250)}
let reviewPhoto='';function reviewForm(){reviewPhoto='';modal(`<h2>요리 후기 작성</h2><p>직접 만들어 본 소감과 사진을 남겨주세요.</p><form onsubmit="addReview(event)"><label>별점<select name="rating"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></label><br><label>후기<textarea name="text" required></textarea></label><br><label>직접 만든 사진<input type="file" accept="image/*" onchange="readReviewPhoto(this)"></label><br><button class="primary">후기 저장</button></form>`)}function addReview(e){e.preventDefault();let f=new FormData(e.target);state.reviews[current]??=[];state.reviews[current].push({text:f.get('text'),rating:+f.get('rating'),photo:reviewPhoto});try{persist()}catch{state.reviews[current].pop();return toast('저장 공간이 부족합니다.')}closeModal();page='detail';detail()}
function profile(){$('#app').innerHTML=`<div class="eyebrow">내 레시피와 설정</div><h1>${esc(state.profile)}</h1><p>내가 만든 레시피와 저장한 레시피를 관리하고, 이름과 대표 이미지를 변경하세요.</p><div class="panel row"><div><span class="tag">나만의 프로필</span><h2 style="margin:12px 0">${esc(state.profile)}</h2><span class="subtle">내 레시피 ${state.recipes.length}개 · 저장 ${state.saved.length}개</span></div><button class="outline" onclick="editProfile()">이름 변경</button></div><div class="panel"><div class="row"><div><h3>대표 이미지</h3><p class="subtle">사이드바와 상단 로고 이미지를 변경합니다.</p></div><button class="outline" onclick="brandImageSettings()">이미지 변경</button></div><img src="${esc(brandImageSource())}" alt="현재 대표 이미지" style="width:100px;height:100px;object-fit:contain;border-radius:14px"><p class="subtle">프로필과 함께 저장됩니다. 설치된 앱 아이콘에는 반영되지 않습니다.</p></div><div class="panel"><h3>저장 및 동기화 안내</h3><p>로그인 전 기록은 이 브라우저에 저장됩니다. Google 로그인 후에는 본인 계정에 저장되며, 다른 기기에서 로그인하고 동기화를 누르면 불러올 수 있습니다. 기존 기록은 상단의 브라우저 기록 가져오기로 옮기세요. 공개 게시, 댓글, 신고 기능은 아직 제공하지 않습니다. 같은 기록을 여러 기기에서 동시에 수정하면 마지막 저장 내용이 적용됩니다.</p><button class="outline" onclick="exportData()">내 데이터 파일로 저장 ↓</button></div><div class="section-head"><h2>내가 만든 레시피</h2><button class="primary" onclick="editor()">＋ 새 레시피</button></div><div class="grid">${cards(state.recipes)}</div>`}
function editProfile(){modal(`<h2>내 키친 이름 변경</h2><label>이름<input id="pn" maxlength="30" value="${esc(state.profile)}"></label><br><button class="primary" onclick="state.profile=$('#pn').value.trim()||'나의 키친';persist();closeModal();profile()">저장</button>`)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='yumstep-recipes.json';a.click();URL.revokeObjectURL(a.href)}
function policy(){modal(`<h2>YumStep 이용 안내</h2><h3>사진·글 사용 및 원본 표시</h3><p>직접 작성하거나 사용 권한을 가진 사진과 글을 등록해 주세요. 변형 레시피에는 원본 레시피와 작성자 정보가 함께 표시됩니다.</p><h3>알레르기 · 영양 정보</h3><p>사용자 입력 정보는 정확성을 보장하지 않습니다. 제품 표시와 개별 재료를 확인해 주세요. 영양 수치는 검증되지 않아 제공하지 않습니다.</p><h3>현재 서비스 범위</h3><p>개인 체험 버전으로, 공개 게시나 다른 이용자와의 교류는 제공하지 않습니다. 로그인 전 기록은 브라우저에 저장됩니다. 로그인한 계정의 기록은 Firebase에 비공개로 저장되며 같은 계정으로 다른 기기에서 불러올 수 있습니다.</p><p class="subtle">앱에 기본으로 표시되는 레시피와 요리 사진은 체험용 예시입니다.</p>`)}

const defaultBrandImage='yumstep-recipe-notebook.webp';
function brandImageSource(){return /^data:image\/(png|jpeg|webp);base64,/.test(state.brandImage||'')?state.brandImage:defaultBrandImage}
function applyBrandImage(){document.querySelectorAll('.brand-image').forEach(img=>img.src=brandImageSource())}
let brandImageDraft='',brandImageBusy=false,brandImageSession=0;
function brandImageSettings(){
 const session=++brandImageSession;
 brandImageDraft=state.brandImage||'';brandImageBusy=false;
 modal(`<h2>대표 이미지 변경</h2><p>사이드바와 상단 로고에 사용할 이미지를 선택하세요.</p><img id="brand-preview" src="${esc(brandImageSource())}" alt="선택한 대표 이미지 미리보기" style="display:block;width:190px;height:190px;max-width:100%;object-fit:contain;background:#f5f6f2;border-radius:18px;margin:20px auto"><label>이미지 파일<input type="file" accept="image/png,image/jpeg,image/webp" onchange="selectBrandImage(this,${session})"></label><p id="brand-image-status" role="status" class="subtle">PNG · JPG · WebP / 최대 10MB. 이미지는 비율을 유지해 저장합니다.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" id="brand-image-save" onclick="saveBrandImage()">저장</button><button class="outline" id="brand-image-reset" onclick="resetBrandImageDraft()">기본 이미지로 복원</button></div><p class="subtle">로그인 상태에서는 프로필과 함께 계정에 저장됩니다. 설치된 앱 아이콘에는 반영되지 않습니다.</p>`);
}
function resetBrandImageDraft(){brandImageDraft='';$('#brand-preview').src=defaultBrandImage;$('#brand-image-status').textContent='저장을 누르면 기본 이미지로 복원됩니다.'}
async function selectBrandImage(input,session){
 const file=input.files?.[0];if(!file)return;
 const status=$('#brand-image-status');
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)){input.value='';status.textContent='PNG, JPG 또는 WebP 이미지를 선택해 주세요.';return}
 if(file.size>10*1024*1024){input.value='';status.textContent='10MB 이하의 이미지를 선택해 주세요.';return}
 brandImageBusy=true;input.disabled=true;$('#brand-image-save').disabled=true;$('#brand-image-reset').disabled=true;status.textContent='이미지를 준비하고 있어요.';
 let url;
 try{
  url=URL.createObjectURL(file);const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth*img.naturalHeight>40000000)throw new Error('dimensions');
  const scale=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const data=canvas.toDataURL('image/webp',0.9);
  if(session!==brandImageSession||!status.isConnected)return;
  brandImageDraft=data;$('#brand-preview').src=data;status.textContent='미리보기를 확인하고 저장을 눌러 주세요.';
 }catch{
  if(session===brandImageSession&&status.isConnected)status.textContent='이미지를 읽을 수 없습니다. 다른 이미지 또는 더 작은 이미지를 선택해 주세요.';
 }finally{
  if(url)URL.revokeObjectURL(url);
  if(session===brandImageSession&&status.isConnected){brandImageBusy=false;input.disabled=false;$('#brand-image-save').disabled=false;$('#brand-image-reset').disabled=false;input.value=''}
 }
}
function saveBrandImage(){
 if(brandImageBusy)return;
 const previous=state.brandImage;
 if(brandImageDraft)state.brandImage=brandImageDraft;else delete state.brandImage;
 try{persist()}catch{if(previous===undefined)delete state.brandImage;else state.brandImage=previous;toast('브라우저 저장 공간이 부족해 이미지를 변경하지 못했어요.');return}
 applyBrandImage();closeModal();render();toast('대표 이미지를 저장했어요.');
}
applyBrandImage();

render();
window.yumstepData={get:()=>structuredClone(state),replace:value=>{state=value;applyBrandImage();if((page==='detail'||page==='compare'||page==='cook')&&!get(current))page='profile';clearInterval(clock);ticking=false;if(page==='cook')page='detail';render()},close:()=>{closeModal();clearInterval(clock);window.wl?.release()}};
</script><script type="module" src="firebase-sync.js"></script></html>
